[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melosync-backend"
version = "2.0.0"
description = "meloSync FastAPI and WebSockets Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.0",
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
