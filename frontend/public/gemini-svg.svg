<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado vibrante estilo Apple Music -->
    <linearGradient id="appleMusicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2d48" />
      <stop offset="45%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Reflejo / Iluminación superior del squircle -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.25)" />
    </linearGradient>

    <!-- Sombra del vinilo sobre el squircle -->
    <filter id="vinylShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Sombra sutil de la nota blanca sobre el vinilo -->
    <filter id="noteShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Cuadrado con esquinas redondeadas (Squircle) con degradado vibrante y transparencia exterior -->
  <rect x="36" y="36" width="440" height="440" rx="110" ry="110" fill="url(#appleMusicGrad)" stroke="url(#squircleBorder)" stroke-width="3.5" />

  <!-- 2. EL VINILO (Disco oscuro flotando sobre el degradado) -->
  <g id="vinyl" filter="url(#vinylShadow)">
    <!-- Cuerpo principal del vinilo -->
    <circle cx="256" cy="256" r="155" fill="#101016" stroke="#1d1d28" stroke-width="2" />

    <!-- Surcos concéntricos -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.8" stroke-dasharray="100 25 75 35" />
    <circle cx="256" cy="256" r="105" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="45 15 110 30" />
    <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

    <!-- Centro / Etiqueta del vinilo -->
    <circle cx="256" cy="256" r="44" fill="#181824" stroke="#252536" stroke-width="2" />
    <circle cx="256" cy="256" r="10" fill="#0c0c12" />
  </g>

  <!-- 3. LA NOTA MUSICAL (Blanca de alta fidelidad y contraste) -->
  <g id="musical-note" filter="url(#noteShadow)">
    <!-- Barra superior/puente de la doble corchea -->
    <path d="M 205,175 L 310,145 L 310,195 L 205,225 Z" fill="#ffffff" />

    <!-- Mástiles (plicas) -->
    <rect x="205" y="195" width="16" height="110" rx="4" fill="#ffffff" />
    <rect x="294" y="165" width="16" height="110" rx="4" fill="#ffffff" />

    <!-- Cabezas de las notas -->
    <ellipse cx="185" cy="305" rx="28" ry="22" transform="rotate(-15 185 305)" fill="#ffffff" />
    <ellipse cx="274" cy="275" rx="28" ry="22" transform="rotate(-15 274 275)" fill="#ffffff" />
  </g>
</svg>