[package]
name = "melosync"
version = "2.0.0"
description = "meloSync Desktop Client"
authors = ["meloSync Team"]
edition = "2021"

[lib]
name = "melosync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
