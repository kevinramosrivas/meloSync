<div class="pointer-events-none fixed top-5 right-5 z-50 flex flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 min-w-[280px] max-w-[400px] rounded-xl border border-white/[0.08] bg-[#16161c]/95 p-3.5 shadow-xl backdrop-blur-xl cursor-pointer transition-opacity hover:border-white/[0.16] animate-fade-in"
      (click)="toastService.dismiss(toast.id)"
    >
      <div class="flex shrink-0 items-center justify-center"
           [class.text-emerald-400]="toast.type === 'success'"
           [class.text-red-400]="toast.type === 'error'"
           [class.text-blue-400]="toast.type === 'info'"
           [class.text-amber-400]="toast.type === 'warning'">
        <app-icon [name]="getIconName(toast.type)" [size]="18" />
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[13px] font-semibold text-white leading-tight">{{ toast.title }}</div>
        @if (toast.message) {
          <div class="mt-0.5 text-[11.5px] text-zinc-400">{{ toast.message }}</div>
        }
      </div>
      <button class="flex h-5 w-5 items-center justify-center rounded text-zinc-500 hover:text-white transition-colors" type="button" (click)="toastService.dismiss(toast.id); $event.stopPropagation()" title="Cerrar">
        <app-icon name="x" [size]="13" />
      </button>
    </div>
  }
</div>
